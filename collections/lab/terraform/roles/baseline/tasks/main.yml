---
- name: Install English language support on RHEL 9
  ansible.builtin.dnf:
    name: glibc-langpack-en
    state: present
  when: ansible_facts.distribution_major_version == "9"

- name: Enable the /tmp tmpfs mount
  ansible.builtin.systemd_service:
    name: tmp.mount
    enabled: true
    masked: false
  when: ansible_facts.distribution_major_version is version("8", ">=")

- name: Configure /etc/hosts for managed hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    owner: root
    group: root
    mode: "0644"
    block: |
      {% for host in ansible_play_hosts -%}
      {{ hostvars[host].ansible_facts.default_ipv4.address }} {{ host }}
      {% endfor -%}

- name: Remove the root password
  ansible.builtin.command:
    argv:
      - passwd
      - -d
      - root

- name: Set the login password
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    state: present
    password: "{{ ansible_user | password_hash('sha512_crypt') }}"
    update_password: always
  no_log: true

- name: Install authorized SSH keys for the login user
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item.url | default(item.pubkey | default('')) }}"
    exclusive: false
    state: present
  loop: "{{ ssh_keys | default([]) }}"
  when: item.url is defined or item.pubkey is defined

- name: Configure password authentication
  block:
    - name: Enable password authentication in the main SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: PasswordAuthentication yes
        state: present
        validate: /usr/sbin/sshd -t -f %s

    - name: Find SSH configuration overrides
      ansible.builtin.shell: grep -l "PasswordAuthentication" /etc/ssh/sshd_config.d/*.conf
      register: _ssh_overrides
      failed_when: false
      changed_when: false

    - name: Enable password authentication in SSH configuration overrides
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(?i)^PasswordAuthentication\s+no'
        replace: PasswordAuthentication yes
        validate: /usr/sbin/sshd -t -f %s
      loop: "{{ _ssh_overrides.stdout_lines }}"
      when: _ssh_overrides.stdout != ""
  notify: Restart sshd

- name: Apply SSH configuration changes now
  ansible.builtin.meta: flush_handlers
